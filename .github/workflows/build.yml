name: Build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DERIVED_DATA: ${{ github.workspace }}/DerivedData

jobs:
  macos:
    name: macOS build + test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: |
            DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: dd-macos-${{ hashFiles('**/*.swift', '**/project.pbxproj', 'project.yml', 'Config/**') }}
          restore-keys: dd-macos-
      # Single build: `test` compiles the app + tests once and runs them.
      - name: Test (macOS)
        run: |
          code=0
          xcodebuild -project FitnessTracker.xcodeproj -scheme FitnessTracker \
            -destination "platform=macOS" -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO test > test.log 2>&1 || code=$?
          grep -E -A60 "error:|OCR accuracy|Test Case .* (passed|failed)|\*\* TEST" test.log | cut -c1-400 || true
          echo "::group::Warnings"; grep -E "warning:" test.log | sort -u || true; echo "::endgroup::"
          [ $code -eq 0 ] || tail -80 test.log
          exit $code

  ios:
    name: iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: |
            DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: dd-ios-${{ hashFiles('**/*.swift', '**/project.pbxproj', 'project.yml', 'Config/**') }}
          restore-keys: dd-ios-
      # build-for-testing compiles app + test bundle once, for one simulator arch only.
      - name: Build for testing (iOS Simulator, arm64)
        run: |
          xcodebuild -project FitnessTracker.xcodeproj -scheme FitnessTracker \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build-for-testing > build.log 2>&1 || { tail -80 build.log; exit 1; }
          tail -5 build.log
          echo "::group::Warnings"; grep -E "warning:" build.log | sort -u || true; echo "::endgroup::"

  xcodegen:
    name: XcodeGen spec check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate project from project.yml
        run: |
          brew install xcodegen
          rm -rf FitnessTracker.xcodeproj
          xcodegen
          xcodebuild -list -project FitnessTracker.xcodeproj | tee list.txt
          grep -q FitnessTrackerTests list.txt
