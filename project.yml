# XcodeGen spec mirroring the committed FitnessTracker.xcodeproj.
# Regenerate with: brew install xcodegen && xcodegen
name: FitnessTracker
options:
  bundleIdPrefix: com.jonathanlehr
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  FitnessTracker:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FitnessTracker
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanlehr.FitnessTracker
        PRODUCT_NAME: FitnessTracker
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Mac sandbox + read access to user-selected files (file importer, drag & drop)
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # iCloud (CloudKit) + push entitlements, per platform
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Config/FitnessTracker-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/FitnessTracker-macOS.entitlements
        # iOS background mode remote-notification (merged with the generated Info.plist)
        "INFOPLIST_FILE[sdk=iphone*]": Config/Info-iOS.plist
        INFOPLIST_KEY_CFBundleDisplayName: FitnessTracker
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSCameraUsageDescription: FitnessTracker uses the camera to photograph the iFit workout summary screen.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: FitnessTracker reads photos of the iFit workout summary screen.
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  FitnessTrackerTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FitnessTrackerTests   # includes Resources/*.jpg sample photos (copied as bundle resources)
    dependencies:
      - target: FitnessTracker
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanlehr.FitnessTrackerTests
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FitnessTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FitnessTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FitnessTracker:
    shared: true
    build:
      targets:
        FitnessTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FitnessTrackerTests
    profile:
      config: Release
    archive:
      config: Release
