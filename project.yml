# Fallback: regenerate the Xcode project with XcodeGen (brew install xcodegen && xcodegen)
name: FitnessTracker
options:
  bundleIdPrefix: com.jonathanlehr
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  FitnessTracker:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [FitnessTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathanlehr.FitnessTracker
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ENABLE_APP_SANDBOX: YES
        TARGETED_DEVICE_FAMILY: "1,2"
